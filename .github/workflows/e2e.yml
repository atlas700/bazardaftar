name: Pilot browser workflow

on:
  push:
  workflow_dispatch:
    inputs:
      recovery:
        description: Restore and verify synthetic staging before the browser workflow
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: afcs_restore_drill
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore -d afcs_restore_drill"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://restore:ci_only@127.0.0.1:5432/afcs_task07_verify
      AFCS_TEST_DATABASE_URL: postgresql://restore:ci_only@127.0.0.1:5432/afcs_task07_verify
      APP_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore and compare synthetic staging with restricted runtime grants
        if: github.event_name == 'workflow_dispatch' && inputs.recovery && github.repository == 'atlas700/bazardaftar'
        run: |
          docker run --rm --network host --add-host restore:127.0.0.1 \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            --env STAGING_DATABASE_URL --env BACKBLAZE_BUCKET_NAME \
            --env BACKBLAZE_BUCKET_REGION --env BACKBLAZE_BUCKET_ENDPOINT \
            --env BACKBLAZE_BUCKET_KEY_ID --env BACKBLAZE_BUCKET_APP_KEY \
            postgres:18-bookworm bash -c '
              set -e
              apt-get update -qq
              apt-get install -y --no-install-recommends python3-venv ca-certificates
              python3 -m venv /tmp/backup-venv
              /tmp/backup-venv/bin/pip install -r scripts/backup-requirements.txt
              /tmp/backup-venv/bin/python scripts/staging_backup.py'
          echo 'AFCS_E2E_RUNTIME_DATABASE_URL=postgresql://afcs_restore_runtime:ci_only@127.0.0.1:5432/afcs_task07_verify' >> "$GITHUB_ENV"
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          BACKBLAZE_BUCKET_NAME: ${{ vars.STAGING_BACKUP_BUCKET }}
          BACKBLAZE_BUCKET_REGION: ${{ vars.STAGING_BACKUP_REGION }}
          BACKBLAZE_BUCKET_ENDPOINT: ${{ vars.STAGING_BACKUP_ENDPOINT }}
          BACKBLAZE_BUCKET_KEY_ID: ${{ secrets.STAGING_BACKUP_KEY_ID }}
          BACKBLAZE_BUCKET_APP_KEY: ${{ secrets.STAGING_BACKUP_APP_KEY }}
      - name: Create the isolated browser database
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.recovery }}" = "true" ]; then
            psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE afcs_task07_verify TEMPLATE afcs_restore_drill'
          else
            psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE afcs_task07_verify'
          fi
        env:
          PGHOST: 127.0.0.1
          PGUSER: restore
          PGPASSWORD: ci_only
          PGDATABASE: postgres
      - run: npm run db:migrate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.recovery) }}
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pilot-browser-failure
          path: |
            artifacts/e2e-results/**/*.png
            artifacts/e2e-results/**/*.md
          retention-days: 3
