name: Pilot browser workflow

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: afcs_task07_verify
          POSTGRES_USER: afcs_ci
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afcs_ci -d afcs_task07_verify"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://afcs_ci:ci_only@127.0.0.1:5432/afcs_task07_verify
      AFCS_TEST_DATABASE_URL: postgresql://afcs_ci:ci_only@127.0.0.1:5432/afcs_task07_verify
      APP_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pilot-browser-failure
          path: |
            artifacts/e2e-results/**/*.png
            artifacts/e2e-results/**/*.md
          retention-days: 3
